[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "teslaforge"
version = "0.1.0"
description = "The single greatest, most powerful, revolutionary open-source Tesla Coil design optimizer."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "TeslaForge Architect", email = "architect@teslaforge.dev"}
]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "optuna>=3.6.0",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "flake8>=7.0.0"
]
